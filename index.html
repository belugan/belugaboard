<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0B3B4A">
    <title>白鲸信息板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <!-- 极简导航栏 -->
        <nav class="navbar">
            <div class="nav-content">
<div class="brand">
    <img class="brand-icon" src="images/logo.jpg" alt="白鲸信息板">
    <span class="brand-name">白鲸信息板</span>
</div>
                <div class="nav-meta">
                    <span class="update-indicator">
                        <span class="dot"></span>
                        <span id="updateBadge">同步中</span>
                    </span>
                </div>
            </div>
        </nav>

        <!-- 置顶区域 - 横向滑动卡片 -->
        <section class="pinned-section" id="pinnedSection">
            <div class="section-label">
                <span>📌 置顶</span>
            </div>
            <div class="pinned-scroll" id="pinnedScroll">
                <div class="pinned-placeholder">加载中...</div>
            </div>
        </section>

        <!-- 信息流主体 -->
        <main class="timeline" id="timeline">
            <div class="timeline-placeholder">
                <div class="wave-loader">
                    <span></span><span></span><span></span>
                </div>
                <p>白鲸正在潜游...</p>
            </div>
        </main>

        <!-- 简约底栏 -->
        <footer class="page-footer">
            <p>🐋 深蓝回响 · 每日清新</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
